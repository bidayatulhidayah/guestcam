# Conda environment for the guestcam project
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
# Use:     conda activate guestcam
# Not in this file: the Google Cloud CLI (gcloud). conda-forge has no Windows
# build, so it is installed with Google's Windows installer; see
# docs/setup/new-computer.md. Do not add google-cloud-sdk here.
name: guestcam
channels:
  - conda-forge
dependencies:
  - nodejs=24          # Node.js LTS (front end + Cloud Functions runtime nodejs24)
  - openjdk=21         # required by the Firebase emulators (Firestore, Storage)
  - ffmpeg             # local testing of video / boomerang / voice processing
  - git
  - gh                 # GitHub CLI: sign-in, cloning, pull requests (also used by Claude Code)
  - python=3.12        # optional helper scripts (load test, data export)
  - pip
  - pip:
      - locust         # load testing: simulate 200 guests uploading
